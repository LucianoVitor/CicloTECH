name: CodeQL

on:
  push:
    branches: [main, feature/mobile-app]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira às 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analisar (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - evidencias
              - mobile/android

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
